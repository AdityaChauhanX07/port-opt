[package]
name = "engine-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
engine = { path = "../engine" }
nalgebra = "0.33"
wasm-bindgen = "0.2"
js-sys = "0.3"
serde_json = "1.0"
console_error_panic_hook = "0.1"
getrandom = { version = "0.2", features = ["js"] }
